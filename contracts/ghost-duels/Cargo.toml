[package]
name = "ghost-duels"
description = "Ghost Duels: stake to beat a recorded run; a replay of the inputs (on-chain, a registered runner, or an OutLayer TEE) settles it; top runs are NEP-171 ghosts that earn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
ghost-sim = { path = "../../game/sim" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
